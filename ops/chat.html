<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef0fb">
<title>مركز العمليات — الدردشة</title>
<link rel="stylesheet" href="/chat.css">
</head>
<body>
<div id="orbs" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="app">

  <!-- ══ جهات الاتصال ══ -->
  <aside id="pane-threads">
    <header class="top-bar">
      <div class="me">
        <span class="avatar founder">أ</span>
        <div>
          <h1>مركز العمليات</h1>
          <p class="sub-line">NG Academy · نظام وكلائك</p>
        </div>
      </div>
      <div class="head-acts">
        <button id="theme-btn" title="ليلي / نهاري" aria-label="تبديل الوضع"><svg class="ic"><use href="#i-moon"/></svg></button>
        <a id="to-tables" href="/console" title="عرض الجداول الكاملة"><svg class="ic"><use href="#i-grid"/></svg></a>
      </div>
    </header>

    <div class="scroll">
      <section class="hero" aria-label="ترحيب">
        <img class="mascot" src="/mascot.png" alt="تميمة الأكاديمية">
        <div class="hero-txt">
          <h2>مرحبًا بك في<br>مركز العمليات!</h2>
          <p class="hero-sub">كل ما تحتاجه لإدارة دوراتك بسهولة</p>
          <p id="sub" class="hero-count">…</p>
        </div>
      </section>

      <section class="tiles" id="tiles" aria-label="وكلاؤك الأربعة"></section>

      <div class="sec-head">
        <b><span class="sec-ic"><svg class="ic"><use href="#i-chats"/></svg></span> المحادثات</b>
        <button id="pend-pill" class="sec-pill" title="افتح محادثة رئيس العمليات">…</button>
      </div>

      <div id="threads" role="list"></div>

      <footer class="foot-note">
        <svg class="ic s12"><use href="#i-lock"/></svg> كل رسالة مسجّلة في تدقيق لا يُمحى · <a href="/console">الجداول الكاملة</a>
      </footer>
    </div>
  </aside>

  <!-- ══ المحادثة ══ -->
  <main id="pane-chat" class="hidden">
    <header class="chat-head">
      <button id="back" aria-label="رجوع"><svg class="ic s22"><use href="#i-back"/></svg></button>
      <span class="avatar sm" id="head-av">…</span>
      <div class="who">
        <b id="head-name">…</b>
        <span id="head-status">…</span>
      </div>
      <button id="revoke-btn" title="إيقاف / استئناف الوكيل"></button>
    </header>

    <div id="msgs" aria-live="polite"></div>

    <div id="chips"></div>
    <form id="composer" autocomplete="off">
      <input id="inp" placeholder="اكتب… «موافقة 12» · «رفض 12 السبب: …» · «الملخص» · «ابحث عن …»">
      <button id="send" type="submit" aria-label="إرسال"><svg class="ic s20"><use href="#i-send"/></svg></button>
    </form>
  </main>

</div>
<nav id="tabbar" aria-label="التنقل الرئيسي">
  <button data-nav="settings" title="الإعدادات"><svg class="ic"><use href="#i-gear"/></svg><span>الإعدادات</span></button>
  <button data-nav="alerts" title="الإشعارات"><span class="bellwrap"><svg class="ic"><use href="#i-bell"/></svg><i id="bell-dot" hidden></i></span><span>الإشعارات</span></button>
  <button data-nav="home" class="fab" title="الرئيسية" aria-label="الرئيسية"><svg class="ic s22"><use href="#i-home"/></svg></button>
  <button data-nav="schedule" title="الجدول"><svg class="ic"><use href="#i-cal"/></svg><span>الجدول</span></button>
  <button data-nav="reports" title="التقارير"><svg class="ic"><use href="#i-chart"/></svg><span>التقارير</span></button>
</nav>
<div id="sheet-back" hidden></div>
<div id="sheet" role="dialog" aria-modal="true" hidden></div>
